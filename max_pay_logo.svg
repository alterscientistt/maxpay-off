    <rect x="48" y="48" width="416" height="416" rx="78" fill="none" stroke="#ffffff" stroke-opacity="0.05" stroke-width="1.5"/>
    <!-- M letterform -->
    <path fill="url(#letter)" d="M104 364V148h64l88 140 88-140h64v216h-56V250l-82 130h-28l-82-130v114H104z"/>
